[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docxtool"
version = "0.1.0"
description = "DOCX official-document formatting web service"
requires-python = ">=3.10,<3.11"
dependencies = [
    "argon2-cffi>=23.1.0,<26",
    "python-docx>=1.1.2,<2",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "pip-tools==7.6.0",
    "pytest==9.1.1",
    "ruff==0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docxtool = ["resources/config/*.json"]
