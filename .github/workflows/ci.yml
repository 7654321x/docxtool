name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest

      - name: Run worker routing tests
        run: node --test tests/worker-routing.test.mjs

      - name: Run frontend format configuration tests
        run: node --test tests/frontend-format-config.test.mjs

      - name: Run recognition regression tests
        run: python -m pytest tests/test_recognition_decoder.py

      - name: Run ruff
        run: python -m ruff check src tests scripts

      - name: Verify package build
        run: python -m build

  windows-startup:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Check Windows startup entry point
        shell: pwsh
        run: pwsh -NoProfile -File .\run.ps1 -CheckOnly
